<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<title>MySongs</title>
<link rel="manifest" href="manifest.json">

<style>
:root{
--bg:#101116;
--panel:#191b23;
--panel2:#242631;
--text:#f4f3f8;
--muted:#a0a1ad;
--line:#30323d;
--accent:#b39aff;
--accentText:#211832;
--purple:#7250b7;
--purple2:#35274f;
--blue:#425c7b;
--blue2:#25354a;
--green:#4f947a;
--gold:#b9934b;
--danger:#d46d79;
--shadow:0 10px 35px #0002;
}
body.light{
--bg:#f5f4f8;
--panel:#fff;
--panel2:#eeedf4;
--text:#22232b;
--muted:#70727e;
--line:#e0e0e8;
--accent:#7654d8;
--accentText:#fff;
--purple:#8c70d0;
--purple2:#e8ddfa;
--blue:#6486a8;
--blue2:#e0eaf5;
--green:#68a58a;
--gold:#b99552;
--danger:#d46d79;
--shadow:0 8px 25px #00000008;
}
*{box-sizing:border-box}
body{
margin:0;background:var(--bg);color:var(--text);
font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
transition:background .2s,color .2s
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;color:inherit}
button:active{transform:scale(.98)}
.app{max-width:1100px;margin:auto;padding:0 20px 105px}
.top{
height:68px;display:flex;align-items:center;gap:12px;
border-bottom:1px solid var(--line);position:sticky;top:0;
background:var(--bg);z-index:5
}
.brand{font-size:21px;font-weight:850;margin-right:auto;letter-spacing:-.5px}
.brand span{color:var(--accent)}
.iconbtn{
width:42px;height:42px;border:1px solid var(--line);
border-radius:14px;background:var(--panel);display:grid;place-items:center;
color:var(--text);flex-shrink:0
}
.iconbtn svg{width:20px;height:20px}
.content{padding:25px 0}
h1{font-size:28px;margin:0 0 7px;letter-spacing:-.5px}
h2{font-size:19px;margin:0}
h3{font-size:15px;margin:0}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
.hero{padding:17px 0 5px}
.hero h1{font-size:31px;line-height:1.2;max-width:550px}
.hero p{color:var(--muted);line-height:1.5;margin:8px 0 0}
.searchbox{
display:flex;align-items:center;gap:10px;
background:var(--panel);border:1px solid var(--line);
border-radius:30px;padding:0 16px;margin:19px 0
}
.searchbox svg{width:19px;height:19px;color:var(--muted);flex-shrink:0}
.searchbox input{
width:100%;border:0;outline:0;background:transparent;
color:var(--text);padding:14px 0
}
.primary,.secondary{
border:0;border-radius:12px;padding:11px 15px;font-weight:700;
display:inline-flex;align-items:center;justify-content:center;gap:8px
}
.primary{background:var(--accent);color:var(--accentText)}
.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.primary svg,.secondary svg{width:17px;height:17px}
.quickgrid{
display:grid;grid-template-columns:repeat(3,1fr);
gap:12px;margin:21px 0 28px
}
.quick{
border:0;border-radius:18px;padding:16px;min-width:0;
cursor:pointer;position:relative;overflow:hidden;
color:white;min-height:116px;text-align:left;
box-shadow:var(--shadow);transition:transform .15s
}
.quick:active{transform:scale(.98)}
.quick.favorite{background:linear-gradient(135deg,#493064,#261b3c)}
.quick.tagsquick{background:linear-gradient(135deg,#526a85,#35465b)}
.quick.musicquick{background:linear-gradient(135deg,#387b70,#244c4a)}
.quick .qicon{
width:39px;height:39px;border-radius:13px;
display:grid;place-items:center;background:#ffffff20;margin-bottom:12px
}
.quick .qicon svg{width:21px;height:21px}
.quick strong{display:block;font-size:19px;line-height:1.2}
.quick small{display:block;color:#ffffffb5;font-size:11px;margin-top:4px}
.quick .qcount{position:absolute;right:14px;top:14px;font-size:12px;color:#ffffffa0}
.bar{
display:flex;align-items:center;justify-content:space-between;
gap:12px;margin:25px 0 14px
}
.bar h2{font-size:18px}
.bar .muted{margin-left:auto}
.sectiontitle{font-size:18px;font-weight:750}
.tabs{
display:flex;gap:22px;border-bottom:1px solid var(--line);
margin:10px 0 15px;overflow:auto
}
.tab{
border:0;background:transparent;color:var(--muted);
padding:12px 2px 10px;white-space:nowrap;font-weight:650;
border-bottom:2px solid transparent
}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.controlsrow{
display:flex;align-items:center;justify-content:space-between;
gap:10px;margin:12px 0
}
.controlsrow .muted{white-space:nowrap}
.sortbtn{
border:1px solid var(--line);border-radius:10px;
background:var(--panel);padding:9px 12px;font-size:13px
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:16px}
.song{cursor:pointer;min-width:0}
.cover{
width:100%;aspect-ratio:1;
background:linear-gradient(135deg,#574574,#272b3c);
border-radius:14px;display:grid;place-items:center;
overflow:hidden;position:relative;color:#ffffffb8
}
.cover svg{width:38px;height:38px}
.cover img{width:100%;height:100%;object-fit:cover}
.score{
position:absolute;right:7px;top:7px;
background:#171927dd;color:white;
padding:5px 8px;border-radius:8px;font-size:11px;font-weight:700
}
.song h3{font-size:13px;margin:9px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song p{font-size:11px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{
display:grid;grid-template-columns:48px 1fr auto;gap:12px;
align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer
}
.item:last-child{border:0}
.item .cover{width:48px;border-radius:9px}
.item h3{font-size:13px;margin:0 0 3px}
.item p{font-size:11px;color:var(--muted);margin:0}
.item .ratingbox{text-align:right;min-width:65px}
.item .ratingbox b{font-size:12px}
.item .ratingbox small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.empty{
padding:38px 15px;border:1px dashed var(--line);
border-radius:16px;text-align:center;color:var(--muted);line-height:1.7
}
.empty .big{font-size:30px;margin-bottom:8px;color:var(--accent)}
.spacegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px}
.spacecard{
border:1px solid var(--line);border-radius:19px;
padding:17px;cursor:pointer;position:relative;overflow:hidden;
background:var(--panel);min-height:160px;transition:transform .15s
}
.spacecard:active{transform:scale(.985)}
.spacecard.personal{
background:linear-gradient(145deg,var(--purple2),var(--panel));
}
.spacecard.congregational{
background:linear-gradient(145deg,var(--blue2),var(--panel));
}
.spacecard .spaceicon{
width:47px;height:47px;border-radius:15px;
display:grid;place-items:center;margin-bottom:14px;
background:var(--panel2);color:var(--accent)
}
.spacecard .spaceicon svg{width:24px;height:24px}
.spacecard strong{display:block;font-size:16px;padding-right:35px}
.spacecard .description{
color:var(--muted);font-size:12px;margin-top:5px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.spacecard .count{font-size:12px;color:var(--muted);margin-top:12px}
.spacemenu{
position:absolute;right:12px;top:12px;z-index:2
}
.spacemenu button{
width:36px;height:36px;border:1px solid var(--line);
background:var(--panel);border-radius:12px;display:grid;place-items:center
}
.spacemenu svg{width:18px;height:18px}
.spacehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacehead .spacer{flex:1}
.tags{display:flex;flex-wrap:wrap;gap:9px}
.tag{
padding:9px 13px;border:1px solid var(--line);
border-radius:30px;background:var(--panel2);color:var(--text);font-size:13px
}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.filters select{
padding:10px;background:var(--panel);color:var(--text);
border:1px solid var(--line);border-radius:10px;max-width:100%
}
.switch{background:var(--panel2);border-radius:10px;padding:4px;display:flex}
.switch button{
border:0;background:none;color:var(--muted);
padding:8px 11px;border-radius:7px
}
.switch button.active{background:var(--panel);color:var(--accent)}
.panel{
background:var(--panel);border:1px solid var(--line);
border-radius:15px;padding:17px;margin:13px 0
}
.settings h3{margin-bottom:7px}
.settings p{color:var(--muted);font-size:13px;line-height:1.6}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.bottomnav{
position:fixed;bottom:0;left:0;right:0;z-index:10;
background:var(--panel);border-top:1px solid var(--line);
display:flex;justify-content:center;gap:0;
padding:7px 5px calc(7px + env(safe-area-inset-bottom))
}
.bottomnav button{
border:0;background:none;color:var(--muted);
flex:1;max-width:150px;padding:5px 8px;font-size:20px;
border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px
}
.bottomnav button svg{width:22px;height:22px}
.bottomnav button small{font-size:10px}
.bottomnav button.active{color:var(--accent)}
.bottomnav button.addnav{
color:var(--accent);font-weight:800
}
.bottomnav button.addnav .navicon{
background:var(--accent);color:var(--accentText);
width:36px;height:31px;border-radius:12px;
display:grid;place-items:center
}
.bottomnav button.addnav svg{width:19px;height:19px}
dialog{
width:min(620px,calc(100% - 22px));max-height:90vh;overflow:auto;
border:1px solid var(--line);border-radius:19px;
background:var(--panel);color:var(--text);padding:21px;
box-shadow:0 20px 70px #0004
}
dialog::backdrop{background:#0009;backdrop-filter:blur(3px)}
.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{
width:100%;padding:11px;border:1px solid var(--line);
border-radius:10px;background:var(--bg);color:var(--text);font:inherit
}
.field small{font-size:11px;color:var(--muted);line-height:1.5}
.wide{grid-column:1/-1}
.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.spacechecks{display:flex;flex-wrap:wrap;gap:9px}
.spacecheck{
display:flex;align-items:center;gap:7px;
padding:9px 11px;background:var(--panel2);
border:1px solid var(--line);border-radius:10px
}
.detailcover{
width:100px;aspect-ratio:1;border-radius:17px;overflow:hidden;
background:linear-gradient(135deg,#574574,#272b3c);
display:grid;place-items:center;color:white;flex-shrink:0
}
.detailcover svg{width:40px;height:40px}
.detailcover img{width:100%;height:100%;object-fit:cover}
.detailtop{display:flex;gap:15px;align-items:center}
.detailtop h2{margin:0 0 5px;font-size:21px}
.detailtop .artist{margin:0 0 8px}
.ratinglabel{font-size:13px;font-weight:700}
.ratinglabel.unrated{color:var(--muted)}
.detailpart{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.detailpart>strong{font-size:12px;color:var(--muted)}
.detailpart p{white-space:pre-wrap;line-height:1.65;color:var(--text);font-size:13px;margin:8px 0 0}
.detailpart a{color:var(--accent)}
.detailtags{margin-top:15px}
.detailtags .tag{padding:6px 10px;font-size:11px}
.spacelabels{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.spacelabel{
border:1px solid var(--line);border-radius:30px;
background:var(--panel2);padding:6px 10px;font-size:11px
}
.detailactions{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:20px}
.detailactions button{padding:11px 8px;font-size:12px}
.danger{color:var(--danger)}
.artistrow{
padding:14px;border:1px solid var(--line);border-radius:13px;
background:var(--panel);margin:9px 0;cursor:pointer
}
.artistrow strong{display:block}
.artistrow small{color:var(--muted)}
.artistdetailhead{display:flex;align-items:center;gap:10px;margin:15px 0}
.artistbubble{
width:44px;height:44px;border-radius:50%;
background:var(--panel2);display:grid;place-items:center;color:var(--accent)
}
.artistbubble svg{width:22px;height:22px}
@media(max-width:600px){
.app{padding:0 15px 105px}
.top{height:61px}
.content{padding:19px 0}
.hero{padding-top:12px}
.hero h1{font-size:29px}
.quickgrid{gap:8px}
.quick{padding:12px;min-height:108px;border-radius:15px}
.quick .qicon{width:34px;height:34px;margin-bottom:9px}
.quick strong{font-size:16px}
.quick small{font-size:10px}
.quick .qcount{right:10px;top:10px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formgrid{grid-template-columns:1fr}
.wide{grid-column:auto}
.detailcover{width:85px}
.detailtop h2{font-size:18px}
.spacegrid{grid-template-columns:1fr 1fr;gap:9px}
.spacecard{padding:13px;min-height:150px}
.spacecard .spaceicon{width:40px;height:40px;margin-bottom:11px}
.spacecard strong{font-size:14px}
.spacecard .description{font-size:11px}
.spacecard .count{font-size:11px}
}
</style>
</head>

<body>
<div class="app">
<header class="top">
<button class="iconbtn" id="settingsBtn" aria-label="Configuración">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1 1.1 1.9-1.8 1.8-1.9-1.1-.1-.1a7.9 7.9 0 0 1-1.6.7l-.1.1-.5 2.1h-2.6l-.5-2.1-.1-.1a7.9 7.9 0 0 1-1.6-.7l-.1.1-1.9 1.1-1.8-1.8 1.1-1.9.1-.1a7.9 7.9 0 0 1-.7-1.6l-.1-.1-2.1-.5v-2.6l2.1-.5.1-.1a7.9 7.9 0 0 1 .7-1.6l-.1-.1-1.1-1.9L5.7 5.1l1.9 1.1.1.1a7.9 7.9 0 0 1 1.6-.7l.1-.1.5-2.1h2.6l.5 2.1.1.1a7.9 7.9 0 0 1 1.6.7l.1-.1 1.9-1.1 1.8 1.8-1.1 1.9-.1.1a7.9 7.9 0 0 1 .7 1.6l.1.1 2.1.5v2.6l-2.1.5-.1.1a7.9 7.9 0 0 1-.7 1.6Z" transform="translate(-1 -1) scale(.95)"/></svg>
</button>
<div class="brand"><span>♪</span> MySongs</div>
<button class="iconbtn" id="theme" aria-label="Cambiar tema">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg>
</button>
</header>

<main class="content">
<div id="heading"></div>
<div id="view"></div>
</main>
</div>

<nav class="bottomnav">
<button data-page="home" class="active">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9.5V20h14V9.5M9 20v-6h6v6"/></svg>
<small>Inicio</small>
</button>
<button data-page="library">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
<small>Biblioteca</small>
</button>
<button data-page="add" class="addnav">
<span class="navicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
<small>Añadir</small>
</button>
</nav>

<dialog id="editor">
<form id="songform">
<div class="dialoghead">
<h2 id="formtitle">Agregar canción</h2>
<button type="button" class="iconbtn" id="closeform">✕</button>
</div>
<input type="hidden" id="sid">
<div class="formgrid">
<label class="field wide">Título *
<input id="title" required maxlength="120">
</label>
<label class="field wide">Artista / intérprete *
<input id="artist" required maxlength="120">
</label>
<label class="field">Calificación
<input id="rating" type="number" min="1" max="10" step="0.1" inputmode="decimal" placeholder="Ej. 9.7">
<small>Del 1 al 10. Puedes dejarla vacía.</small>
</label>
<label class="field wide">Espacios de biblioteca
<div id="spaceChecks" class="spacechecks"></div>
<small>Una canción puede pertenecer a varios espacios.</small>
</label>
<label class="field wide">Etiquetas
<input id="tags" placeholder="Adoración, Personal, Evangelización…">
<small>Escribe las etiquetas separadas por comas.</small>
</label>
<label class="field wide">Motivo de evaluación
<textarea id="reason" rows="2"></textarea>
</label>
<label class="field wide">Letra
<textarea id="lyrics" rows="5"></textarea>
</label>
<label class="field wide">Enlace externo
<input id="link" type="url" placeholder="https://…">
</label>
<label class="field wide">Notas personales
<textarea id="notes" rows="3"></textarea>
</label>
<label class="field wide">Portada
<input id="cover" type="file" accept="image/*">
<small>La imagen se incluirá en el respaldo.</small>
</label>
</div>
<div class="formactions">
<button type="button" class="secondary" id="cancel">Cancelar</button>
<button class="primary">Guardar canción</button>
</div>
</form>
</dialog>

<dialog id="detail"><div id="detailbody"></div></dialog>

<dialog id="spaceDialog">
<form id="spaceForm">
<div class="dialoghead">
<h2 id="spaceFormTitle">Crear espacio</h2>
<button type="button" class="iconbtn" id="closeSpace">✕</button>
</div>
<label class="field">Nombre del espacio
<input id="spaceName" required maxlength="45" placeholder="Escribe un nombre">
</label>
<label class="field" style="margin-top:12px">Descripción
<textarea id="spaceDescription" rows="2" maxlength="120" placeholder="Añade una descripción (opcional)"></textarea>
</label>
<div class="formactions">
<button type="button" class="secondary" id="cancelSpace">Cancelar</button>
<button class="primary">Guardar</button>
</div>
</form>
</dialog>

<dialog id="spaceMenuDialog">
<div class="dialoghead">
<h2>Opciones del espacio</h2>
<button class="iconbtn" id="closeSpaceMenu">✕</button>
</div>
<div class="actions" style="display:grid">
<button class="secondary" id="menuRename">✎ Editar nombre y descripción</button>
<button class="secondary danger" id="menuDelete">Eliminar espacio</button>
</div>
</dialog>

<input id="importfile" type="file" accept="application/json,.json" hidden>

<script>
const DB='mysongs-v1',STORE='songs';
const CONFIG='mysongs-config-v2';
let db,page='home',mode='list',activeSpace=null,editingSpace=null;
let tagFilter='',searchQuery='',homeTab='songs',selectedArtist=null;
let menuSpace=null,homeSort='recent';
const $=id=>document.getElementById(id);

const ICONS={
music:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,
heart:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6l1.2 1.2L12 21l7.6-7.6 1.2-1.2a5.4 5.4 0 0 0 0-7.6Z"/></svg>`,
tags:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3.4 13.4a2 2 0 0 1 0-2.8L10.6 3.4a2 2 0 0 1 2.8 0l7.2 7.2a2 2 0 0 1 0 2.8Z"/><circle cx="8" cy="8" r="1.4"/></svg>`,

const bands=[
[10,'Perfecto'],[9.5,'Excelente'],[8.5,'Muy buena'],
[7.5,'Buena'],[6,'Buena con reservas'],
[4,'Problemática'],[1,'No recomendable']
];

let config={spaces:[]};

function uid(){
return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
}
function verdict(v){
if(v===''||v==null)return'Sin calificar';
return bands.find(([n])=>Number(v)>=n)?.[1]||'No recomendable';
}
function ratingColor(v){
if(v===''||v==null)return'var(--muted)';
let n=Number(v);
if(n>=9.5)return'#7fd5a4';
if(n>=8.5)return'#9bd28b';
if(n>=7.5)return'#c7c47d';
if(n>=6)return'#e1ae6d';
return'#df8589';
}
function songTags(s){
const old=s.classification?[s.classification]:[];
return [...new Set([...(s.tags||[]),...old].map(t=>String(t).trim()).filter(Boolean))];
}
function allTags(songs){
return [...new Set(songs.flatMap(songTags))].sort((a,b)=>a.localeCompare(b,'es'));
}
function saveConfig(){localStorage.setItem(CONFIG,JSON.stringify(config));}
function loadConfig(){
try{
let saved=JSON.parse(localStorage.getItem(CONFIG)||'null');
if(saved&&Array.isArray(saved.spaces))config=saved;
}catch(e){}
if(!config.spaces.length){
config.spaces=[
{id:uid(),name:'Sin título',description:''},
{id:uid(),name:'Sin título',description:''}
];
saveConfig();
}
config.spaces=config.spaces.map(s=>({
...s,
name:s.name||'Sin título',
description:s.description||''
}));
saveConfig();
}
function openDB(){
return new Promise((ok,no)=>{
let r=indexedDB.open(DB,1);
r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});
r.onsuccess=()=>ok(r.result);
r.onerror=()=>no(r.error);
});
}
function all(){
return new Promise((ok,no)=>{
let r=db.transaction(STORE).objectStore(STORE).getAll();
r.onsuccess=()=>ok(r.result);
r.onerror=()=>no(r.error);
});
}
function put(s){
return new Promise((ok,no)=>{
let t=db.transaction(STORE,'readwrite');
t.objectStore(STORE).put(s);
t.oncomplete=ok;
t.onerror=()=>no(t.error);
});
}
function del(id){
return new Promise((ok,no)=>{
let t=db.transaction(STORE,'readwrite');
t.objectStore(STORE).delete(id);
t.oncomplete=ok;
t.onerror=()=>no(t.error);
});
}
function esc(x=''){
return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function spaceNames(ids=[]){
return ids.map(id=>config.spaces.find(x=>x.id===id)?.name).filter(Boolean);
}
function normalizeSpaces(s){
if(Array.isArray(s.spaces))return s.spaces;
return config.spaces.length?[config.spaces[0].id]:[];
}
function cover(s){

let currentSpaceSort='recent';

function sortSongs(a,sort){
if(sort==='title')a.sort((x,y)=>x.title.localeCompare(y.title,'es'));
if(sort==='artist')a.sort((x,y)=>x.artist.localeCompare(y.artist,'es'));
if(sort==='rating')a.sort((x,y)=>(Number(y.rating)||0)-(Number(x.rating)||0));
if(sort==='recent')a.sort((x,y)=>(y.updated||0)-(x.updated||0));
return a;
}
async function updateSpaceSongs(){
let songs=await all();
let a=applySearch(songs).filter(s=>normalizeSpaces(s).includes(activeSpace));
let rating=$('ratingFilter')?.value||'';
let artist=$('artistFilter')?.value||'';
let tag=$('tagFilter')?.value||'';
let onlyFav=$('onlyFavorites')?.checked||false;
if(rating==='unrated')a=a.filter(s=>s.rating===''||s.rating==null);
else if(rating)a=a.filter(s=>s.rating!==''&&s.rating!=null&&Number(s.rating)>=Number(rating));
if(artist)a=a.filter(s=>s.artist===artist);
if(tag)a=a.filter(s=>songTags(s).includes(tag));
if(onlyFav)a=a.filter(s=>s.favorite);
sortSongs(a,currentSpaceSort);
$('songdisplay').innerHTML=display(a);
bindSongs();
}

function readImage(f){
return new Promise((ok,no)=>{
let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f);
});
}

}
let id=$('sid').value||uid();
let old=(await all()).find(s=>s.id===id);
let cover=$('songform').dataset.cover||'';
if($('cover').files[0])cover=await readImage($('cover').files[0]);

let spaces=[...document.querySelectorAll('input[name="songspace"]:checked')].map(x=>x.value);
await put({
id,title:$('title').value.trim(),artist:$('artist').value.trim(),rating,
tags,spaces,reason:$('reason').value,lyrics:$('lyrics').value,
link:$('link').value,notes:$('notes').value,cover,
favorite:old?.favorite||false,created:old?.created||now,updated:now
});
$('editor').close();
render();
};

async function detail(id){
let s=(await all()).find(x=>x.id===id);
if(!s)return;
let tags=songTags(s);
let names=spaceNames(normalizeSpaces(s));
$('detailbody').innerHTML=`
<div class="dialoghead">
<span class="muted" style="font-size:11px;letter-spacing:1px">DETALLE DE INTERPRETACIÓN</span>
<button class="iconbtn" id="closeDetail">✕</button>
</div>
<div class="detailtop">
<div class="detailcover">${s.cover?`<img src="${s.cover}" alt="">`:ICONS.music}</div>
<div>
<h2>${esc(s.title)}</h2>
<p class="muted artist">${esc(s.artist)}</p>
<div class="ratinglabel ${s.rating===''||s.rating==null?'unrated':''}" style="color:${ratingColor(s.rating)}">
${s.rating!==''&&s.rating!=null?'★ '+esc(s.rating)+' · '+esc(verdict(s.rating)):'— Sin calificar'}
</div>
</div>
</div>
${tags.length?`<div class="detailtags"><div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div>`:''}
${names.length?`<div class="detailpart"><strong>Espacios</strong><div class="spacelabels">${names.map(n=>`<span class="spacelabel">${esc(n)}</span>`).join('')}</div></div>`:''}
${section('Motivo de evaluación',s.reason)}
${section('Letra',s.lyrics)}
${s.link?`<div class="detailpart"><strong>Enlace externo</strong><p><a href="${esc(s.link)}" target="_blank" rel="noopener">Abrir enlace ↗</a></p></div>`:''}
${section('Notas personales',s.notes)}
<div class="detailpart"><p class="muted">Agregada: ${new Date(s.created).toLocaleDateString('es-PA')} · Modificada: ${new Date(s.updated).toLocaleDateString('es-PA')}</p></div>
<div class="actions detailactions">
<button class="primary" id="editone">Editar</button>
<button class="secondary" id="favone">${s.favorite?'♥ Favorita':'♡ Favorita'}</button>
<button class="secondary danger" id="deleteone">Eliminar</button>
</div>`;
$('detail').showModal();
$('closeDetail').onclick=()=>$('detail').close();
$('editone').onclick=()=>{$('detail').close();editSong(s);};
$('favone').onclick=async()=>{
s.favorite=!s.favorite;s.tags=tags;s.spaces=normalizeSpaces(s);delete s.classification;
await put(s);$('detail').close();render();
};
$('deleteone').onclick=async()=>{
if(confirm('¿Eliminar esta canción?')){await del(s.id);$('detail').close();render();}
};
}

async function exportBackup(){
let payload={
app:'MySongs',version:3,exportedAt:new Date().toISOString(),
spaces:config.spaces,
songs:(await all()).map(s=>{
let copy={...s,tags:songTags(s),spaces:normalizeSpaces(s)};
delete copy.classification;return copy;
})
};
let blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
let a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='MySongs_respaldo_'+new Date().toISOString().slice(0,10)+'.json';
a.click();
setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('importfile').onchange=async e=>{
let f=e.target.files[0];if(!f)return;
try{
let data=JSON.parse(await f.text());
if(data.app!=='MySongs'||!Array.isArray(data.songs))throw Error('Archivo no válido');
if(!confirm(`Se importarán ${data.songs.length} canciones. Se combinarán con tu biblioteca; los registros con el mismo identificador se actualizarán. ¿Continuar?`))return;
if(Array.isArray(data.spaces)&&data.spaces.length){
let merged=[...config.spaces];
for(let sp of data.spaces){if(sp.id&&!merged.some(x=>x.id===sp.id))merged.push(sp);}
config.spaces=merged;saveConfig();
}
for(let s of data.songs){
if(s.id&&s.title&&s.artist){
let copy={...s,tags:songTags(s)};
copy.spaces=Array.isArray(s.spaces)?s.spaces:normalizeSpaces(s);
delete copy.classification;await put(copy);
}
}
alert('Biblioteca importada correctamente.');
render();
}catch(err){alert('No se pudo importar: '+err.message);}
finally{e.target.value='';}
};

}
})();
