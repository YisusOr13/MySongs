
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<title>MySongs</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#101116;--panel:#191b23;--panel2:#242631;--text:#f4f3f8;--muted:#a0a1ad;--line:#30323d;--accent:#b39aff;--accentText:#211832}
body.light{--bg:#f5f5f8;--panel:#fff;--panel2:#eeedf4;--text:#22232b;--muted:#70727e;--line:#e0e0e8;--accent:#7654d8;--accentText:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}
.layout{display:flex;min-height:100vh}
.side{width:225px;background:var(--panel);border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column}
.brand{font-size:23px;font-weight:800;padding:0 10px 35px}
.brand i{font-style:normal;background:var(--accent);color:var(--accentText);padding:4px 9px;border-radius:10px;margin-right:8px}
.side button,.mobile button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--muted);padding:12px;border-radius:10px;margin:3px 0;font-weight:600}
.side button.active,.side button:hover,.mobile button.active{background:var(--panel2);color:var(--accent)}
.local{margin-top:auto;color:#70c99a;font-size:11px;padding:12px}
.main{flex:1;min-width:0}
.top{height:75px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 4%}
.top input{width:min(420px,48vw);padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text)}
button{cursor:pointer}
.primary,.secondary,.icon{border:0;border-radius:10px;padding:11px 14px;font-weight:700}
.primary{background:var(--accent);color:var(--accentText)}
.secondary,.icon{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.icon{padding:10px 13px}
.content{max-width:1200px;margin:auto;padding:34px 4% 80px}
h1{font-size:30px;margin:0 0 5px}
h2{font-size:18px}
.muted{color:var(--muted);font-size:13px}
.hero{margin:25px 0;background:linear-gradient(120deg,#352b51,#202330);border:1px solid #51446e;border-radius:18px;padding:25px}
.hero h2{font-size:23px;margin:0 0 8px}
.hero p{color:#d0c9df}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px}
.stat small{color:var(--muted)}
.stat strong{display:block;font-size:26px;margin-top:6px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:25px 0 14px}
.switch{background:var(--panel2);border-radius:9px;padding:4px;display:flex}
.switch button{border:0;background:none;color:var(--muted);padding:8px;border-radius:7px}
.switch button.active{background:var(--panel);color:var(--text)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.filters select{padding:10px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.song{cursor:pointer;min-width:0}
.cover{width:100%;aspect-ratio:1;background:linear-gradient(135deg,#574574,#272b3c);border-radius:13px;display:grid;place-items:center;font-size:42px;overflow:hidden;position:relative}
.cover img{width:100%;height:100%;object-fit:cover}
.score{position:absolute;right:7px;top:7px;background:#171927dd;color:white;padding:4px 7px;border-radius:7px;font-size:11px}
.song h3{font-size:13px;margin:9px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song p{font-size:11px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:48px 1fr 75px;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border:0}
.item .cover{width:48px;border-radius:8px;font-size:20px}
.item h3{font-size:13px;margin:0 0 3px}
.item p{font-size:11px;color:var(--muted);margin:0}
.item b{font-size:12px;color:var(--accent);text-align:right}
.empty{padding:45px 15px;border:1px dashed var(--line);border-radius:13px;text-align:center;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:9px}
.tag{padding:10px 14px;border:1px solid var(--line);border-radius:30px;background:var(--panel2);color:var(--text)}
.settings{margin:15px 0}
.settings h3{margin:0 0 5px}
.settings p{color:var(--muted);font-size:13px;line-height:1.5}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.mobile{display:none}
dialog{width:min(620px,calc(100% - 22px));max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:17px;background:var(--panel);color:var(--text);padding:22px}
dialog::backdrop{background:#000b}
.dialoghead{display:flex;justify-content:space-between;align-items:center}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font:inherit}
.field small{font-size:11px;color:var(--muted)}
.wide{grid-column:1/-1}
.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.detailcover{width:125px;aspect-ratio:1;border-radius:13px;overflow:hidden;background:var(--panel2);display:grid;place-items:center;font-size:40px;flex-shrink:0}
.detailcover img{width:100%;height:100%;object-fit:cover}
.detailtop{display:flex;gap:15px;align-items:center}
.detailtop h2{margin:0 0 5px}
.detailpart{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.detailpart p{white-space:pre-wrap;line-height:1.6;color:var(--muted);font-size:13px}
.mobilebrand{display:none}
@media(max-width:700px){
.side{display:none}
.top{height:62px;padding:0 12px;justify-content:space-between}
.mobilebrand{display:block;font-weight:800}
.top input{width:min(43vw,220px);font-size:12px}
.top .primary{font-size:0;padding:11px}
.top .primary:after{content:'＋';font-size:17px}
.content{padding:25px 14px 95px}
.stats{gap:7px}
.stat{padding:12px}
.stat strong{font-size:21px}
.stat small{font-size:10px}
.hero{padding:19px}
.hero h2{font-size:19px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);z-index:4;justify-content:space-around;padding:7px 2px calc(7px + env(safe-area-inset-bottom))}
.mobile button{width:auto;text-align:center;margin:0;padding:5px 8px;font-size:17px}
.mobile small{display:block;font-size:9px}
.formgrid{grid-template-columns:1fr}
.wide{grid-column:auto}
.detailcover{width:95px}
}
</style>
</head>
<body>
<div class="layout">
<aside class="side">
<div class="brand"><i>♪</i>MySongs</div>
<button data-page="home" class="active">⌂　Inicio</button>
<button data-page="library">▤　Biblioteca</button>
<button data-page="favorites">♡　Favoritas</button>
<button data-page="categories">◇　Etiquetas</button>
<button data-page="stats">▥　Estadísticas</button>
<div style="margin-top:auto">
<button data-page="settings">⚙　Configuración</button>
<div class="local">● Datos guardados en este dispositivo</div>
</div>
</aside>
<main class="main">
<header class="top">
<div class="mobilebrand">♪ MySongs</div>
<input id="search" placeholder="Buscar canciones, artistas o etiquetas…">
<button class="icon" id="theme">☼</button>
<button class="primary" id="add">Agregar canción</button>
</header>
<div class="content">
<div id="heading"></div>
<div id="view"></div>
</div>
</main>
</div>

<nav class="mobile">
<button data-page="home" class="active">⌂<small>Inicio</small></button>
<button data-page="library">▤<small>Biblioteca</small></button>
<button data-page="favorites">♡<small>Favoritas</small></button>
<button data-page="categories">◇<small>Etiquetas</small></button>
<button data-page="settings">⚙<small>Ajustes</small></button>
</nav>

<dialog id="editor">
<form id="songform">
<div class="dialoghead">
<h2 id="formtitle">Agregar canción</h2>
<button type="button" class="icon" id="closeform">✕</button>
</div>
<input type="hidden" id="sid">
<div class="formgrid">
<label class="field wide">Título *
<input id="title" required maxlength="120">
</label>
<label class="field wide">Artista / intérprete *
<input id="artist" required maxlength="120">
</label>
<label class="field">Calificación
<input id="rating" type="number" min="1" max="10" step="0.1" inputmode="decimal" placeholder="Ej. 9.7">
<small>Escribe una nota del 1 al 10. Puedes usar decimales o dejarla vacía.</small>
</label>
<label class="field wide">Etiquetas
<input id="tags" placeholder="Adoración, Personal, Favorita…">
<small>Escribe todas las que quieras, separadas por comas. No hay etiquetas predeterminadas.</small>
</label>
<label class="field wide">Motivo de evaluación
<textarea id="reason" rows="2"></textarea>
</label>
<label class="field wide">Letra
<textarea id="lyrics" rows="5"></textarea>
</label>
<label class="field wide">Enlace externo
<input id="link" type="url" placeholder="https://…">
</label>
<label class="field wide">Notas personales
<textarea id="notes" rows="3"></textarea>
</label>
<label class="field wide">Portada
<input id="cover" type="file" accept="image/*">
<small>La imagen se incluirá en el respaldo.</small>
</label>
</div>
<div class="formactions">
<button type="button" class="secondary" id="cancel">Cancelar</button>
<button class="primary">Guardar canción</button>
</div>
</form>
</dialog>

<dialog id="detail">
<div id="detailbody"></div>
</dialog>

<input id="importfile" type="file" accept="application/json,.json" hidden>

<script>
const DB='mysongs-v1',STORE='songs';
let db,page='home',mode='grid',filter=null;
const $=id=>document.getElementById(id);

const bands=[
[10,'Perfecto'],
[9.5,'Excelente'],
[8.5,'Muy buena'],
[7.5,'Buena'],
[6,'Buena con reservas'],
[4,'Problemática'],
[1,'No recomendable']
];

function verdict(v){
if(v===''||v==null)return'Sin calificar';
return bands.find(([n])=>Number(v)>=n)?.[1]||'No recomendable';
}

function songTags(s){
const old=s.classification?[s.classification]:[];
return [...new Set([...(s.tags||[]),...old].map(t=>String(t).trim()).filter(Boolean))];
}

function allTags(songs){
return [...new Set(songs.flatMap(s=>songTags(s)))].sort((a,b)=>a.localeCompare(b,'es'));
}

function openDB(){
return new Promise((ok,no)=>{
let r=indexedDB.open(DB,1);
r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});
r.onsuccess=()=>ok(r.result);
r.onerror=()=>no(r.error);
});
}

function all(){
return new Promise((ok,no)=>{
let r=db.transaction(STORE).objectStore(STORE).getAll();
r.onsuccess=()=>ok(r.result);
r.onerror=()=>no(r.error);
});
}

function put(s){
return new Promise((ok,no)=>{
let t=db.transaction(STORE,'readwrite');
t.objectStore(STORE).put(s);
t.oncomplete=ok;
t.onerror=()=>no(t.error);
});
}

function del(id){
return new Promise(ok=>{
let t=db.transaction(STORE,'readwrite');
t.objectStore(STORE).delete(id);
t.oncomplete=ok;
});
}

function esc(x=''){
return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function cover(s){
return `<div class="cover">${s.cover?`<img src="${s.cover}">`:'♪'}${s.rating!==''&&s.rating!=null?`<span class="score">★ ${esc(s.rating)}</span>`:''}</div>`;
}

function display(songs){
if(!songs.length)return'<div class="empty">♫<br><b style="color:var(--text)">No hay canciones aquí todavía</b><br>Agrega una canción para comenzar tu biblioteca.</div>';
return mode==='grid'
?`<div class="grid">${songs.map(s=>`<article class="song" data-open="${s.id}">${cover(s)}<h3>${esc(s.title)}</h3><p>${esc(s.artist)}</p></article>`).join('')}</div>`
:`<div class="list">${songs.map(s=>`<div class="item" data-open="${s.id}">${cover(s)}<div><h3>${esc(s.title)}</h3><p>${esc(s.artist)}</p></div><b>${s.rating!==''&&s.rating!=null?'★ '+esc(s.rating):'Sin nota'}</b></div>`).join('')}</div>`;
}

function toggle(){
mode=mode==='grid'?'list':'grid';
render();
}

function header(t,sub){
$('heading').innerHTML=`<h1>${t}</h1><p class="muted">${sub}</p>`;
}

function section(t,v){
return v?`<div class="detailpart"><b>${t}</b><p>${esc(v)}</p></div>`:'';
}

async function render(){
let songs=await all();
let q=$('search').value.toLowerCase().trim();
let arr=songs.filter(s=>`${s.title} ${s.artist} ${songTags(s).join(' ')}`.toLowerCase().includes(q));
let html='';

document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));

if(page==='home'){
header('Tu espacio musical','Tu colección personal, organizada a tu manera.');
let rated=songs.filter(s=>s.rating!==''&&s.rating!=null);
html=`<div class="hero"><h2>Tu música, tus criterios.</h2><p>Guarda, organiza y consulta cada interpretación.</p><button class="primary" onclick="editSong()">＋ Agregar canción</button></div>
<div class="stats">
<div class="stat"><small>Canciones guardadas</small><strong>${songs.length}</strong></div>
<div class="stat"><small>Favoritas</small><strong>${songs.filter(s=>s.favorite).length}</strong></div>
<div class="stat"><small>Calificadas</small><strong>${rated.length}</strong></div>
</div>
<div class="bar"><h2>Agregadas recientemente</h2></div>
${display([...songs].sort((a,b)=>b.updated-a.updated).slice(0,6))}`;
}
else if(page==='library'){
header('Biblioteca','Todas tus canciones e interpretaciones.');
if(filter)arr=arr.filter(s=>songTags(s).includes(filter));
let tags=allTags(songs);
html=`<div class="bar"><b>${arr.length} canciones</b>
<div class="switch">
<button class="${mode==='grid'?'active':''}" onclick="setMode('grid')">▦</button>
<button class="${mode==='list'?'active':''}" onclick="setMode('list')">☷</button>
</div></div>
<div class="filters">
<select id="sort">
<option value="recent">Más recientes</option>
<option value="title">Título A–Z</option>
<option value="artist">Artista A–Z</option>
<option value="rating">Mayor calificación</option>
</select>
<select id="tagfilter">
<option value="">Todas las etiquetas</option>
${tags.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}
</select>
<button class="secondary" onclick="filter=null;render()">Limpiar filtro</button>
</div>
<div id="songdisplay">${display(arr)}</div>`;
}
else if(page==='favorites'){
header('Favoritas','Tus interpretaciones favoritas.');
html=display(arr.filter(s=>s.favorite));
}
else if(page==='categories'){
header('Etiquetas','Organiza y explora tu colección mediante tus propias etiquetas.');
let tags={};
songs.forEach(s=>songTags(s).forEach(t=>tags[t]=(tags[t]||0)+1));
html=`<div class="tags">${Object.entries(tags).sort((a,b)=>a[0].localeCompare(b[0],'es')).map(([t,n])=>`<button class="tag" onclick="filterTag('${esc(t)}')">${esc(t)} · ${n}</button>`).join('')||'<div class="empty">Todavía no tienes etiquetas.<br>Agrega etiquetas al crear o editar una canción.</div>'}</div>`;
}
else if(page==='stats'){
header('Estadísticas','Un vistazo a tu colección.');
let rated=songs.filter(s=>s.rating!==''&&s.rating!=null);
let avg=rated.length?(rated.reduce((a,s)=>a+Number(s.rating),0)/rated.length).toFixed(1):'—';
html=`<div class="stats">
<div class="stat"><small>Total de canciones</small><strong>${songs.length}</strong></div>
<div class="stat"><small>Promedio</small><strong>${avg}</strong></div>
<div class="stat"><small>Sin calificar</small><strong>${songs.length-rated.length}</strong></div>
</div>
<div class="panel"><h3>Distribución de calificaciones</h3>
${bands.map(([n,label],i)=>{
let low=n,high=bands[i-1]?.[0]||10;
let count=rated.filter(s=>Number(s.rating)>=low&&Number(s.rating)<=high).length;
return `<p>${label}: <b>${count}</b></p>`;
}).join('')}
</div>`;
}
else{
header('Configuración','Apariencia y copias de seguridad.');
html=`<div class="panel settings">
<h3>Apariencia</h3>
<p>Cambia entre tema oscuro y claro.</p>
<button class="secondary" onclick="theme()">Cambiar tema</button>
</div>
<div class="panel settings">
<h3>Respaldo de biblioteca</h3>
<p>Exporta canciones, letras, calificaciones, etiquetas, notas y portadas. Guarda el archivo en un lugar seguro. Después puedes importarlo desde otro dispositivo.</p>
<div class="actions">
<button class="primary" onclick="exportBackup()">↓ Exportar biblioteca</button>
<button class="secondary" onclick="$('importfile').click()">↑ Importar respaldo</button>
</div>
</div>
<div class="panel settings">
<h3>Almacenamiento local</h3>
<p>Los datos se guardan en este navegador y dispositivo. Si borras los datos del navegador o desinstalas el navegador, podrías perder la biblioteca. Haz respaldos periódicos.</p>
<b style="color:#70c99a">● Sin cuenta ni suscripción.</b>
</div>`;
}

$('view').innerHTML=html;

document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>detail(el.dataset.open));

if($('sort')){
$('sort').onchange=()=>{
let a=[...arr],v=$('sort').value;
if(v==='title')a.sort((x,y)=>x.title.localeCompare(y.title));
if(v==='artist')a.sort((x,y)=>x.artist.localeCompare(y.artist));
if(v==='rating')a.sort((x,y)=>(Number(y.rating)||0)-(Number(x.rating)||0));
if(v==='recent')a.sort((x,y)=>y.updated-x.updated);
$('songdisplay').innerHTML=display(a);
document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>detail(el.dataset.open));
};
}

if($('tagfilter')){
$('tagfilter').onchange=()=>{
let selected=$('tagfilter').value;
$('songdisplay').innerHTML=display(arr.filter(s=>!selected||songTags(s).includes(selected)));
document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>detail(el.dataset.open));
};
}
}

function setMode(m){
mode=m;
render();
}

function filterTag(t){
filter=t;
page='library';
render();
}

function nav(p){
page=p;
filter=null;
render();
}

document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));
$('search').oninput=render;
$('add').onclick=()=>editSong();
$('theme').onclick=theme;

function theme(){
document.body.classList.toggle('light');
localStorage.setItem('mysongs-theme',document.body.classList.contains('light')?'light':'dark');
}

if(localStorage.getItem('mysongs-theme')==='light')document.body.classList.add('light');

function editSong(s=null){
$('songform').reset();
$('sid').value=s?.id||'';
$('formtitle').textContent=s?'Editar canción':'Agregar canción';

if(s){
for(let k of ['title','artist','rating','reason','lyrics','link','notes'])$(k).value=s[k]??'';
$('tags').value=songTags(s).join(', ');
}

$('songform').dataset.cover=s?.cover||'';
$('editor').showModal();
}

$('closeform').onclick=$('cancel').onclick=()=>$('editor').close();

function readImage(f){
return new Promise((ok,no)=>{
let r=new FileReader();
r.onload=()=>ok(r.result);
r.onerror=no;
r.readAsDataURL(f);
});
}

$('songform').onsubmit=async e=>{
e.preventDefault();

let rating=$('rating').value.trim();
if(rating!==''&&(!Number.isFinite(Number(rating))||Number(rating)<1||Number(rating)>10)){
alert('La calificación debe estar entre 1 y 10.');
return;
}

let id=$('sid').value||crypto.randomUUID();
let old=(await all()).find(s=>s.id===id);
let cover=$('songform').dataset.cover||'';

if($('cover').files[0])cover=await readImage($('cover').files[0]);

let now=Date.now();
let tags=[...new Set($('tags').value.split(',').map(x=>x.trim()).filter(Boolean))];

await put({
id,
title:$('title').value.trim(),
artist:$('artist').value.trim(),
rating,
tags,
reason:$('reason').value,
lyrics:$('lyrics').value,
link:$('link').value,
notes:$('notes').value,
cover,
favorite:old?.favorite||false,
created:old?.created||now,
updated:now
});

$('editor').close();
render();
};

async function detail(id){
let s=(await all()).find(x=>x.id===id);
if(!s)return;

let tags=songTags(s);

$('detailbody').innerHTML=`
<div class="dialoghead">
<span class="muted">DETALLE DE INTERPRETACIÓN</span>
<button class="icon" onclick="$('detail').close()">✕</button>
</div>
<div class="detailtop">
<div class="detailcover">${s.cover?`<img src="${s.cover}">`:'♪'}</div>
<div>
<h2>${esc(s.title)}</h2>
<p class="muted">${esc(s.artist)}</p>
<b style="color:var(--accent)">${s.rating!==''&&s.rating!=null?'★ '+esc(s.rating)+' · '+verdict(s.rating):'Sin calificar'}</b>
</div>
</div>
${tags.length?`<div class="detailpart"><b>Etiquetas</b><div class="tags" style="margin-top:10px">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div>`:''}
${section('Motivo de evaluación',s.reason)}
${section('Letra',s.lyrics)}
${s.link?`<div class="detailpart"><b>Enlace externo</b><p><a href="${esc(s.link)}" target="_blank" rel="noopener">Abrir enlace ↗</a></p></div>`:''}
${section('Notas personales',s.notes)}
<div class="detailpart"><p>Agregada: ${new Date(s.created).toLocaleDateString('es-PA')} · Modificada: ${new Date(s.updated).toLocaleDateString('es-PA')}</p></div>
<div class="actions">
<button class="primary" id="editone">Editar</button>
<button class="secondary" id="favone">${s.favorite?'♥ Quitar favorita':'♡ Marcar favorita'}</button>
<button class="secondary" id="deleteone">Eliminar</button>
</div>`;

$('detail').showModal();

$('editone').onclick=()=>{
$('detail').close();
editSong(s);
};

$('favone').onclick=async()=>{
s.favorite=!s.favorite;
s.tags=tags;
delete s.classification;
await put(s);
$('detail').close();
render();
};

$('deleteone').onclick=async()=>{
if(confirm('¿Eliminar esta canción?')){
await del(s.id);
$('detail').close();
render();
}
};
}

async function exportBackup(){
let payload={
app:'MySongs',
version:2,
exportedAt:new Date().toISOString(),
songs:(await all()).map(s=>{
let copy={...s,tags:songTags(s)};
delete copy.classification;
return copy;
})
};

let blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
let a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='MySongs_respaldo_'+new Date().toISOString().slice(0,10)+'.json';
a.click();
URL.revokeObjectURL(a.href);
}

$('importfile').onchange=async e=>{
let f=e.target.files[0];
if(!f)return;

try{
let data=JSON.parse(await f.text());

if(data.app!=='MySongs'||!Array.isArray(data.songs))throw Error('Archivo no válido');

if(!confirm(`Se importarán ${data.songs.length} canciones. Se combinarán con tu biblioteca; los registros con el mismo identificador se actualizarán. ¿Continuar?`))return;

for(let s of data.songs){
if(s.id&&s.title&&s.artist){
let copy={...s,tags:songTags(s)};
delete copy.classification;
await put(copy);
}
}

alert('Biblioteca importada correctamente.');
render();

}catch(err){
alert('No se pudo importar: '+err.message);
}finally{
e.target.value='';
}
};

(async()=>{
try{
db=await openDB();
await render();

if('serviceWorker'in navigator&&location.protocol.startsWith('http')){
navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

}catch(e){
$('view').innerHTML='<div class="empty">No se pudo iniciar el almacenamiento local. Abre MySongs con Chrome actualizado.</div>';
}
})();
</script>
