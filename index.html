
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<title>MySongs</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
--bg:#101116;--panel:#191b23;--panel2:#242631;
--text:#f4f3f8;--muted:#a0a1ad;--line:#30323d;
--accent:#b39aff;--accentText:#211832;
}
body.light{
--bg:#f5f5f8;--panel:#fff;--panel2:#eeedf4;
--text:#22232b;--muted:#70727e;--line:#e0e0e8;
--accent:#7654d8;--accentText:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1100px;margin:auto;padding:0 20px 110px}
.top{
height:70px;display:flex;align-items:center;gap:13px;
border-bottom:1px solid var(--line);position:sticky;top:0;
background:var(--bg);z-index:5
}
.brand{font-size:21px;font-weight:850;margin-right:auto}
.brand span{color:var(--accent)}
.iconbtn{
width:42px;height:42px;border:1px solid var(--line);
border-radius:13px;background:var(--panel);color:var(--text);
font-size:19px
}
.content{padding:28px 0}
h1{font-size:28px;margin:0 0 7px}
h2{font-size:19px;margin:0}
h3{font-size:15px;margin:0}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
.hero{padding:23px 0 15px}
.hero h1{font-size:27px;line-height:1.25;max-width:500px}
.hero p{color:var(--muted);line-height:1.5;margin:8px 0 18px}
.searchbox{
display:flex;align-items:center;gap:9px;
background:var(--panel);border:1px solid var(--line);
border-radius:14px;padding:0 14px;margin:18px 0
}
.searchbox span{font-size:18px;color:var(--muted)}
.searchbox input{
width:100%;border:0;outline:0;background:transparent;
color:var(--text);padding:14px 0
}
.primary,.secondary{
border:0;border-radius:11px;padding:11px 15px;font-weight:700
}
.primary{background:var(--accent);color:var(--accentText)}
.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.addbutton{display:flex;align-items:center;gap:8px}
.quickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 28px}
.quick{
background:var(--panel);border:1px solid var(--line);
border-radius:15px;padding:16px;min-width:0;cursor:pointer
}
.quick .qicon{font-size:23px;margin-bottom:10px}
.quick strong{display:block;font-size:22px}
.quick small{color:var(--muted);font-size:11px}
.quick p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:25px 0 14px}
.bar h2{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:16px}
.song{cursor:pointer;min-width:0}
.cover{
width:100%;aspect-ratio:1;background:linear-gradient(135deg,#574574,#272b3c);
border-radius:13px;display:grid;place-items:center;font-size:40px;
overflow:hidden;position:relative
}
.cover img{width:100%;height:100%;object-fit:cover}
.score{
position:absolute;right:7px;top:7px;background:#171927dd;
color:white;padding:4px 7px;border-radius:7px;font-size:11px
}
.song h3{font-size:13px;margin:9px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song p{font-size:11px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{border:1px solid var(--line);border-radius:13px;overflow:hidden}
.item{
display:grid;grid-template-columns:48px 1fr 65px;gap:12px;
align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer
}
.item:last-child{border:0}
.item .cover{width:48px;border-radius:8px;font-size:20px}
.item h3{font-size:13px;margin:0 0 3px}
.item p{font-size:11px;color:var(--muted);margin:0}
.item b{font-size:12px;color:var(--accent);text-align:right}
.empty{
padding:40px 15px;border:1px dashed var(--line);
border-radius:14px;text-align:center;color:var(--muted);line-height:1.7
}
.empty .big{font-size:30px;margin-bottom:8px}
.spacegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.spacecard{
background:var(--panel);border:1px solid var(--line);
border-radius:15px;padding:18px;cursor:pointer
}
.spacecard .spaceicon{font-size:25px;margin-bottom:12px}
.spacecard strong{display:block;font-size:16px}
.spacecard small{display:block;color:var(--muted);margin-top:5px}
.spacehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacehead .spacer{flex:1}
.tags{display:flex;flex-wrap:wrap;gap:9px}
.tag{
padding:10px 14px;border:1px solid var(--line);
border-radius:30px;background:var(--panel2);color:var(--text)
}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.filters select{
padding:10px;background:var(--panel);color:var(--text);
border:1px solid var(--line);border-radius:9px;max-width:100%
}
.switch{background:var(--panel2);border-radius:10px;padding:4px;display:flex}
.switch button{
border:0;background:none;color:var(--muted);
padding:8px 11px;border-radius:7px
}
.switch button.active{background:var(--panel);color:var(--accent)}
.panel{
background:var(--panel);border:1px solid var(--line);
border-radius:14px;padding:17px;margin:13px 0
}
.settings h3{margin-bottom:7px}
.settings p{color:var(--muted);font-size:13px;line-height:1.6}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.bottomnav{
position:fixed;bottom:0;left:0;right:0;z-index:10;
background:var(--panel);border-top:1px solid var(--line);
display:flex;justify-content:center;gap:0;
padding:8px 5px calc(8px + env(safe-area-inset-bottom))
}
.bottomnav button{
border:0;background:none;color:var(--muted);
flex:1;max-width:150px;padding:5px 8px;font-size:20px;
border-radius:10px
}
.bottomnav button.active{color:var(--accent)}
.bottomnav small{display:block;font-size:10px;margin-top:3px}
dialog{
width:min(620px,calc(100% - 22px));max-height:90vh;overflow:auto;
border:1px solid var(--line);border-radius:17px;
background:var(--panel);color:var(--text);padding:22px
}
dialog::backdrop{background:#000b}
.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{
width:100%;padding:11px;border:1px solid var(--line);
border-radius:9px;background:var(--bg);color:var(--text);font:inherit
}
.field small{font-size:11px;color:var(--muted);line-height:1.5}
.wide{grid-column:1/-1}
.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.spacechecks{display:flex;flex-wrap:wrap;gap:9px}
.spacecheck{
display:flex;align-items:center;gap:7px;
padding:9px 11px;background:var(--panel2);
border:1px solid var(--line);border-radius:10px
}
.detailcover{
width:115px;aspect-ratio:1;border-radius:13px;overflow:hidden;
background:var(--panel2);display:grid;place-items:center;font-size:40px;flex-shrink:0
}
.detailcover img{width:100%;height:100%;object-fit:cover}
.detailtop{display:flex;gap:15px;align-items:center}
.detailtop h2{margin:0 0 5px}
.detailpart{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.detailpart p{white-space:pre-wrap;line-height:1.6;color:var(--muted);font-size:13px}
.detailpart a{color:var(--accent)}
@media(max-width:600px){
.app{padding:0 15px 105px}
.top{height:61px}
.content{padding:22px 0}
.hero h1{font-size:24px}
.quickgrid{gap:8px}
.quick{padding:12px}
.quick .qicon{font-size:20px}
.quick strong{font-size:20px}
.quick small{font-size:10px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formgrid{grid-template-columns:1fr}
.wide{grid-column:auto}
.detailcover{width:90px}
}
</style>
</head>
<body>

<div class="app">
<header class="top">
<button class="iconbtn" id="settingsBtn" aria-label="Configuración">⚙</button>
<div class="brand"><span>♪</span> MySongs</div>
<button class="iconbtn" id="theme" aria-label="Cambiar tema">☼</button>
</header>

<main class="content">
<div id="heading"></div>
<div id="view"></div>
</main>
</div>

<nav class="bottomnav">
<button data-page="home" class="active">⌂<small>Inicio</small></button>
<button data-page="library">▤<small>Biblioteca</small></button>
<button data-page="categories">◇<small>Etiquetas</small></button>
</nav>

<dialog id="editor">
<form id="songform">
<div class="dialoghead">
<h2 id="formtitle">Agregar canción</h2>
<button type="button" class="iconbtn" id="closeform">✕</button>
</div>
<input type="hidden" id="sid">
<div class="formgrid">
<label class="field wide">Título *
<input id="title" required maxlength="120">
</label>
<label class="field wide">Artista / intérprete *
<input id="artist" required maxlength="120">
</label>
<label class="field">Calificación
<input id="rating" type="number" min="1" max="10" step="0.1" inputmode="decimal" placeholder="Ej. 9.7">
<small>Del 1 al 10. Puedes dejarla vacía.</small>
</label>
<label class="field wide">Espacios de biblioteca
<div id="spaceChecks" class="spacechecks"></div>
<small>Una canción puede pertenecer a varios espacios.</small>
</label>
<label class="field wide">Etiquetas
<input id="tags" placeholder="Adoración, Personal, Evangelización…">
<small>Escribe las etiquetas separadas por comas.</small>
</label>
<label class="field wide">Motivo de evaluación
<textarea id="reason" rows="2"></textarea>
</label>
<label class="field wide">Letra
<textarea id="lyrics" rows="5"></textarea>
</label>
<label class="field wide">Enlace externo
<input id="link" type="url" placeholder="https://…">
</label>
<label class="field wide">Notas personales
<textarea id="notes" rows="3"></textarea>
</label>
<label class="field wide">Portada
<input id="cover" type="file" accept="image/*">
<small>La imagen se incluirá en el respaldo.</small>
</label>
</div>
<div class="formactions">
<button type="button" class="secondary" id="cancel">Cancelar</button>
<button class="primary">Guardar canción</button>
</div>
</form>
</dialog>

<dialog id="detail">
<div id="detailbody"></div>
</dialog>

<dialog id="spaceDialog">
<form id="spaceForm">
<div class="dialoghead">
<h2 id="spaceFormTitle">Crear espacio</h2>
<button type="button" class="iconbtn" id="closeSpace">✕</button>
</div>
<label class="field">Nombre del espacio
<input id="spaceName" required maxlength="45" placeholder="Ej. Canciones personales">
</label>
<div class="formactions">
<button type="button" class="secondary" id="cancelSpace">Cancelar</button>
<button class="primary">Guardar</button>
</div>
</form>
</dialog>

<input id="importfile" type="file" accept="application/json,.json" hidden>

<script>
const DB='mysongs-v1',STORE='songs';
const CONFIG='mysongs-config-v2';
let db,page='home',mode='grid',activeSpace=null,editingSpace=null;
let tagFilter='',searchQuery='';
const $=id=>document.getElementById(id);

const bands=[
[10,'Perfecto'],[9.5,'Excelente'],[8.5,'Muy buena'],
[7.5,'Buena'],[6,'Buena con reservas'],
[4,'Problemática'],[1,'No recomendable']
];

let config={spaces:[]};

function uid(){
return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function verdict(v){
if(v===''||v==null)return'Sin calificar';
return bands.find(([n])=>Number(v)>=n)?.[1]||'No recomendable';
}

function songTags(s){
const old=s.classification?[s.classification]:[];
return [...new Set([...(s.tags||[]),...old].map(t=>String(t).trim()).filter(Boolean))];
}

function allTags(songs){
return [...new Set(songs.flatMap(songTags))].sort((a,b)=>a.localeCompare(b,'es'));
}

function saveConfig(){
localStorage.setItem(CONFIG,JSON.stringify(config));
}

function loadConfig(){
try{
let saved=JSON.parse(localStorage.getItem(CONFIG)||'null');
if(saved&&Array.isArray(saved.spaces))config=saved;
}catch(e){}
if(!config.spaces.length){
config.spaces=[
{id:uid(),name:'Canciones personales'},
{id:uid(),name:'Canciones congregacionales'}
];
saveConfig();
}
}

function openDB(){
return new Promise((ok,no)=>{
let r=indexedDB.open(DB,1);
r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});
r.onsuccess=()=>ok(r.result);
r.onerror=()=>no(r.error);
});
}

function all(){
return new Promise((ok,no)=>{
let r=db.transaction(STORE).objectStore(STORE).getAll();
r.onsuccess=()=>ok(r.result);
r.onerror=()=>no(r.error);
});
}

function put(s){
return new Promise((ok,no)=>{
let t=db.transaction(STORE,'readwrite');
t.objectStore(STORE).put(s);
t.oncomplete=ok;
t.onerror=()=>no(t.error);
});
}

function del(id){
return new Promise((ok,no)=>{
let t=db.transaction(STORE,'readwrite');
t.objectStore(STORE).delete(id);
t.oncomplete=ok;
t.onerror=()=>no(t.error);
});
}

function esc(x=''){
return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function spaceNames(ids=[]){
return ids.map(id=>config.spaces.find(x=>x.id===id)?.name).filter(Boolean);
}

function normalizeSpaces(s){
if(Array.isArray(s.spaces))return s.spaces;
return config.spaces.length?[config.spaces[0].id]:[];
}

function cover(s){
return `<div class="cover">${s.cover?`<img src="${s.cover}">`:'♪'}${s.rating!==''&&s.rating!=null?`<span class="score">★ ${esc(s.rating)}</span>`:''}</div>`;
}

function display(songs){
if(!songs.length)return `<div class="empty"><div class="big">♫</div><b style="color:var(--text)">No hay canciones aquí todavía</b><br>Agrega una canción para comenzar tu colección.</div>`;
return mode==='grid'
?`<div class="grid">${songs.map(s=>`<article class="song" data-open="${esc(s.id)}">${cover(s)}<h3>${esc(s.title)}</h3><p>${esc(s.artist)}</p></article>`).join('')}</div>`
:`<div class="list">${songs.map(s=>`<div class="item" data-open="${esc(s.id)}">${cover(s)}<div><h3>${esc(s.title)}</h3><p>${esc(s.artist)}</p></div><b>${s.rating!==''&&s.rating!=null?'★ '+esc(s.rating):'Sin nota'}</b></div>`).join('')}</div>`;
}

function bindSongs(){
document.querySelectorAll('[data-open]').forEach(el=>{
el.onclick=()=>detail(el.dataset.open);
});
}

function header(title,sub=''){
$('heading').innerHTML=`<h1>${esc(title)}</h1>${sub?`<p class="muted">${esc(sub)}</p>`:''}`;
}

function searchBox(){
return `<div class="searchbox"><span>⌕</span><input id="pageSearch" value="${esc(searchQuery)}" placeholder="Buscar canciones, artistas o etiquetas…"></div>`;
}

function bindSearch(){
let el=$('pageSearch');
if(el)el.oninput=()=>{
searchQuery=el.value;
render();
let next=$('pageSearch');
if(next){next.focus();next.setSelectionRange(searchQuery.length,searchQuery.length);}
};
}

function section(t,v){
return v?`<div class="detailpart"><b>${t}</b><p>${esc(v)}</p></div>`:'';
}

function applySearch(songs){
let q=searchQuery.toLowerCase().trim();
return songs.filter(s=>`${s.title} ${s.artist} ${songTags(s).join(' ')}`.toLowerCase().includes(q));
}

async function render(){
let songs=await all();
let html='';
document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));

if(page==='home'){
header('Tu espacio musical');
let rated=songs.filter(s=>s.rating!==''&&s.rating!=null);
let fav=songs.filter(s=>s.favorite);
let tags=allTags(songs);

$('heading').innerHTML=`
<div class="hero">
<h1>Tu música, tus criterios.</h1>
<p>Guarda, organiza y consulta cada interpretación.</p>
<button class="primary addbutton" id="homeAdd">＋ Agregar canción</button>
</div>`;

html=`
${searchBox()}
<div class="quickgrid">
<div class="quick" data-goto="library">
<div class="qicon">♫</div><strong>${songs.length}</strong>
<small>Canciones guardadas</small>
</div>
<div class="quick" data-goto="favorites">
<div class="qicon">♥</div><strong>${fav.length}</strong>
<small>Favoritas</small>
</div>
<div class="quick" data-goto="categories">
<div class="qicon">◇</div><strong>${tags.length}</strong>
<small>Etiquetas creadas</small>
</div>
</div>
<div class="bar"><h2>Agregadas recientemente</h2></div>
${display(applySearch([...songs].sort((a,b)=>(b.updated||0)-(a.updated||0))).slice(0,6))}
`;
}
else if(page==='library'){
header('Biblioteca','Organiza tus canciones en espacios personalizados.');
if(activeSpace){
let space=config.spaces.find(x=>x.id===activeSpace);
if(!space){activeSpace=null;return render();}
let arr=applySearch(songs).filter(s=>normalizeSpaces(s).includes(activeSpace));
let artists=[...new Set(songs.map(s=>s.artist).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
let tags=allTags(songs);

html=`
<div class="spacehead">
<button class="secondary" id="backSpaces">← Espacios</button>
<div class="spacer"></div>
<button class="secondary" id="renameSpace">✎ Renombrar</button>
<button class="secondary" id="deleteSpace">Eliminar</button>
</div>
<div class="bar"><h2>📁 ${esc(space.name)}</h2></div>
${searchBox()}
<div class="bar">
<b>${arr.length} canciones</b>
<div class="switch">
<button class="${mode==='grid'?'active':''}" data-mode="grid">▦</button>
<button class="${mode==='list'?'active':''}" data-mode="list">☷</button>
</div>
</div>
<div class="filters">
<select id="sort">
<option value="recent">Más recientes</option>
<option value="title">Título A–Z</option>
<option value="artist">Artista A–Z</option>
<option value="rating">Mayor calificación</option>
</select>
<select id="ratingFilter">
<option value="">Todas las calificaciones</option>
<option value="9.5">9.5 o más</option>
<option value="8.5">8.5 o más</option>
<option value="7.5">7.5 o más</option>
<option value="6">6 o más</option>
<option value="unrated">Sin calificar</option>
</select>
<select id="artistFilter">
<option value="">Todos los artistas</option>
${artists.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('')}
</select>
<select id="tagFilter">
<option value="">Todas las etiquetas</option>
${tags.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}
</select>
<label class="spacecheck"><input type="checkbox" id="onlyFavorites"> ♥ Favoritas</label>
</div>
<div id="songdisplay">${display(arr)}</div>`;
}else{
html=`
<div class="bar">
<h2>Mis espacios</h2>
<button class="primary" id="addSpace">＋ Crear espacio</button>
</div>
<p class="muted">Crea colecciones a tu manera. Puedes tener tantos espacios como necesites.</p>
<div class="spacegrid">
${config.spaces.map(sp=>{
let count=songs.filter(s=>normalizeSpaces(s).includes(sp.id)).length;
return `<div class="spacecard" data-space="${esc(sp.id)}">
<div class="spaceicon">📁</div>
<strong>${esc(sp.name)}</strong>
<small>${count} ${count===1?'canción':'canciones'}</small>
</div>`;
}).join('')}
</div>
${!config.spaces.length?'<div class="empty">Todavía no tienes espacios. Crea uno para comenzar.</div>':''}
`;
}
}
else if(page==='favorites'){
header('Favoritas','Las canciones que has marcado para tenerlas a mano.');
let arr=applySearch(songs.filter(s=>s.favorite));
html=searchBox()+display(arr);
}
else if(page==='categories'){
header('Etiquetas','Explora tu colección mediante tus propias etiquetas.');
let tags={};
songs.forEach(s=>songTags(s).forEach(t=>tags[t]=(tags[t]||0)+1));
html=`
${searchBox()}
<div class="tags">
${Object.entries(tags).filter(([t])=>!searchQuery||t.toLowerCase().includes(searchQuery.toLowerCase()))
.sort((a,b)=>a[0].localeCompare(b[0],'es'))
.map(([t,n])=>`<button class="tag" data-tag="${esc(t)}">${esc(t)} · ${n}</button>`).join('')}
</div>
${Object.keys(tags).length?'':'<div class="empty">Todavía no tienes etiquetas.<br>Agrega etiquetas al crear o editar una canción.</div>'}
`;
}
else if(page==='settings'){
header('Configuración','Ajustes y copias de seguridad.');
html=`
<div class="panel settings">
<h3>🎨 Apariencia</h3>
<p>Cambia entre tema oscuro y claro.</p>
<button class="secondary" id="themeSettings">Cambiar tema</button>
</div>
<div class="panel settings">
<h3>💾 Respaldo de biblioteca</h3>
<p>Exporta canciones, espacios, letras, calificaciones, etiquetas, notas y portadas. Guarda el archivo en un lugar seguro.</p>
<div class="actions">
<button class="primary" id="exportBtn">↓ Exportar biblioteca</button>
<button class="secondary" id="importBtn">↑ Importar respaldo</button>
</div>
</div>
<div class="panel settings">
<h3>📱 Almacenamiento local</h3>
<p>Los datos se guardan en este navegador y dispositivo. Si borras los datos del navegador podrías perder la biblioteca. Haz respaldos periódicos.</p>

}

$('view').innerHTML=html;
bindSongs();
bindSearch();

if($('homeAdd'))$('homeAdd').onclick=()=>editSong();
document.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>nav(el.dataset.goto));
document.querySelectorAll('[data-space]').forEach(el=>el.onclick=()=>{
activeSpace=el.dataset.space;render();
});
document.querySelectorAll('[data-tag]').forEach(el=>el.onclick=()=>{
tagFilter=el.dataset.tag;activeSpace=null;page='library';render();
});

if($('addSpace'))$('addSpace').onclick=()=>editSpace();
if($('backSpaces'))$('backSpaces').onclick=()=>{activeSpace=null;render();};
if($('renameSpace'))$('renameSpace').onclick=()=>{
let sp=config.spaces.find(x=>x.id===activeSpace);
if(sp)editSpace(sp);
};
if($('deleteSpace'))$('deleteSpace').onclick=async()=>{
let sp=config.spaces.find(x=>x.id===activeSpace);
if(!sp)return;
if(!confirm(`¿Eliminar el espacio "${sp.name}"? Las canciones no se borrarán, solo dejarán de pertenecer a este espacio.`))return;
config.spaces=config.spaces.filter(x=>x.id!==activeSpace);
saveConfig();
let allSongs=await all();
for(let s of allSongs){
s.spaces=normalizeSpaces(s).filter(id=>id!==activeSpace);
await put(s);
}
activeSpace=null;
render();
};

document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{
mode=el.dataset.mode;render();
});

if($('sort')){
let original=applySearch(songs).filter(s=>normalizeSpaces(s).includes(activeSpace));
let update=()=>{
let a=[...original];
let sort=$('sort').value;
let rating=$('ratingFilter').value;
let artist=$('artistFilter').value;
let tag=$('tagFilter').value;
let onlyFav=$('onlyFavorites').checked;

if(rating==='unrated')a=a.filter(s=>s.rating===''||s.rating==null);
else if(rating)a=a.filter(s=>s.rating!==''&&s.rating!=null&&Number(s.rating)>=Number(rating));
if(artist)a=a.filter(s=>s.artist===artist);
if(tag)a=a.filter(s=>songTags(s).includes(tag));
if(onlyFav)a=a.filter(s=>s.favorite);

if(sort==='title')a.sort((x,y)=>x.title.localeCompare(y.title));
if(sort==='artist')a.sort((x,y)=>x.artist.localeCompare(y.artist));
if(sort==='rating')a.sort((x,y)=>(Number(y.rating)||0)-(Number(x.rating)||0));
if(sort==='recent')a.sort((x,y)=>(y.updated||0)-(x.updated||0));

$('songdisplay').innerHTML=display(a);
bindSongs();
};
['sort','ratingFilter','artistFilter','tagFilter','onlyFavorites'].forEach(id=>{
$(id).onchange=update;
});
if(tagFilter){
$('tagFilter').value=tagFilter;
tagFilter='';
update();
}
}

if($('themeSettings'))$('themeSettings').onclick=theme;
if($('exportBtn'))$('exportBtn').onclick=exportBackup;
if($('importBtn'))$('importBtn').onclick=()=>$('importfile').click();
}

function nav(p){
page=p;
activeSpace=null;
searchQuery='';
tagFilter='';
render();
}

document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));
$('settingsBtn').onclick=()=>nav('settings');
$('theme').onclick=theme;

function theme(){
document.body.classList.toggle('light');
localStorage.setItem('mysongs-theme',document.body.classList.contains('light')?'light':'dark');
}

if(localStorage.getItem('mysongs-theme')==='light')document.body.classList.add('light');

function editSpace(space=null){
editingSpace=space?.id||null;
$('spaceFormTitle').textContent=space?'Renombrar espacio':'Crear espacio';
$('spaceName').value=space?.name||'';
$('spaceDialog').showModal();
$('spaceName').focus();
}

$('closeSpace').onclick=$('cancelSpace').onclick=()=>$('spaceDialog').close();

$('spaceForm').onsubmit=e=>{
e.preventDefault();
let name=$('spaceName').value.trim();
if(!name)return;
if(config.spaces.some(s=>s.name.toLowerCase()===name.toLowerCase()&&s.id!==editingSpace)){
alert('Ya existe un espacio con ese nombre.');
return;
}
if(editingSpace){
let sp=config.spaces.find(x=>x.id===editingSpace);
if(sp)sp.name=name;
}else{
config.spaces.push({id:uid(),name});
}
saveConfig();
$('spaceDialog').close();
render();
};

function editSong(s=null){
$('songform').reset();
$('sid').value=s?.id||'';
$('formtitle').textContent=s?'Editar canción':'Agregar canción';

for(let k of ['title','artist','rating','reason','lyrics','link','notes']){
$(k).value=s?.[k]??'';
}
$('tags').value=s?songTags(s).join(', '):'';
$('songform').dataset.cover=s?.cover||'';

let assigned=s?normalizeSpaces(s):[];
$('spaceChecks').innerHTML=config.spaces.map(sp=>`
<label class="spacecheck">
<input type="checkbox" name="songspace" value="${esc(sp.id)}" ${assigned.includes(sp.id)?'checked':''}>
${esc(sp.name)}
</label>`).join('')||'<span class="muted">Crea un espacio desde Biblioteca para organizar tus canciones.</span>';

$('editor').showModal();
}

$('closeform').onclick=$('cancel').onclick=()=>$('editor').close();

function readImage(f){
return new Promise((ok,no)=>{
let r=new FileReader();
r.onload=()=>ok(r.result);
r.onerror=no;
r.readAsDataURL(f);
});
}

$('songform').onsubmit=async e=>{
e.preventDefault();
let rating=$('rating').value.trim();
if(rating!==''&&(!Number.isFinite(Number(rating))||Number(rating)<1||Number(rating)>10)){
alert('La calificación debe estar entre 1 y 10.');
return;
}
let id=$('sid').value||uid();
let old=(await all()).find(s=>s.id===id);
let cover=$('songform').dataset.cover||'';
if($('cover').files[0])cover=await readImage($('cover').files[0]);

let now=Date.now();
let tags=[...new Set($('tags').value.split(',').map(x=>x.trim()).filter(Boolean))];
let spaces=[...document.querySelectorAll('input[name="songspace"]:checked')].map(x=>x.value);

await put({
id,
title:$('title').value.trim(),
artist:$('artist').value.trim(),
rating,
tags,
spaces,
reason:$('reason').value,
lyrics:$('lyrics').value,
link:$('link').value,
notes:$('notes').value,
cover,
favorite:old?.favorite||false,
created:old?.created||now,
updated:now
});

$('editor').close();
render();
};

async function detail(id){
let s=(await all()).find(x=>x.id===id);
if(!s)return;
let tags=songTags(s);
let names=spaceNames(normalizeSpaces(s));

$('detailbody').innerHTML=`
<div class="dialoghead">
<span class="muted">DETALLE DE INTERPRETACIÓN</span>
<button class="iconbtn" id="closeDetail">✕</button>
</div>
<div class="detailtop">
<div class="detailcover">${s.cover?`<img src="${s.cover}">`:'♪'}</div>
<div>
<h2>${esc(s.title)}</h2>
<p class="muted">${esc(s.artist)}</p>
<b style="color:var(--accent)">${s.rating!==''&&s.rating!=null?'★ '+esc(s.rating)+' · '+verdict(s.rating):'Sin calificar'}</b>
</div>
</div>
${names.length?`<div class="detailpart"><b>Espacios</b><p>${names.map(esc).join(' · ')}</p></div>`:''}
${tags.length?`<div class="detailpart"><b>Etiquetas</b><div class="tags" style="margin-top:10px">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div>`:''}
${section('Motivo de evaluación',s.reason)}
${section('Letra',s.lyrics)}
${s.link?`<div class="detailpart"><b>Enlace externo</b><p><a href="${esc(s.link)}" target="_blank" rel="noopener">Abrir enlace ↗</a></p></div>`:''}
${section('Notas personales',s.notes)}
<div class="detailpart"><p>Agregada: ${new Date(s.created).toLocaleDateString('es-PA')} · Modificada: ${new Date(s.updated).toLocaleDateString('es-PA')}</p></div>
<div class="actions">
<button class="primary" id="editone">Editar</button>
<button class="secondary" id="favone">${s.favorite?'♥ Quitar favorita':'♡ Marcar favorita'}</button>
<button class="secondary" id="deleteone">Eliminar</button>
</div>`;

$('detail').showModal();
$('closeDetail').onclick=()=>$('detail').close();

$('editone').onclick=()=>{
$('detail').close();
editSong(s);
};

$('favone').onclick=async()=>{
s.favorite=!s.favorite;
s.tags=tags;
s.spaces=normalizeSpaces(s);
delete s.classification;
await put(s);
$('detail').close();
render();
};

$('deleteone').onclick=async()=>{
if(confirm('¿Eliminar esta canción?')){
await del(s.id);
$('detail').close();
render();
}
};
}

async function exportBackup(){
let payload={
app:'MySongs',
version:3,
exportedAt:new Date().toISOString(),
spaces:config.spaces,
songs:(await all()).map(s=>{
let copy={...s,tags:songTags(s),spaces:normalizeSpaces(s)};
delete copy.classification;
return copy;
})
};
let blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
let a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='MySongs_respaldo_'+new Date().toISOString().slice(0,10)+'.json';
a.click();
setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

$('importfile').onchange=async e=>{
let f=e.target.files[0];
if(!f)return;
try{
let data=JSON.parse(await f.text());
if(data.app!=='MySongs'||!Array.isArray(data.songs))throw Error('Archivo no válido');

if(!confirm(`Se importarán ${data.songs.length} canciones. Se combinarán con tu biblioteca; los registros con el mismo identificador se actualizarán. ¿Continuar?`))return;

if(Array.isArray(data.spaces)&&data.spaces.length){
let merged=[...config.spaces];
for(let sp of data.spaces){
if(sp.id&&!merged.some(x=>x.id===sp.id))merged.push(sp);
}
config.spaces=merged;
saveConfig();
}

for(let s of data.songs){
if(s.id&&s.title&&s.artist){
let copy={...s,tags:songTags(s)};
copy.spaces=Array.isArray(s.spaces)?s.spaces:normalizeSpaces(s);
delete copy.classification;
await put(copy);
}
}
alert('Biblioteca importada correctamente.');
render();
}catch(err){
alert('No se pudo importar: '+err.message);
}finally{
e.target.value='';
}
};

try{
db=await openDB();
loadConfig();

// Migración: las canciones antiguas se asignan al primer espacio.
let songs=await all();

if(!Array.isArray(s.spaces)){

navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
}catch(e){
$('view').innerHTML='<div class="empty">No se pudo iniciar el almacenamiento local. Abre MySongs con Chrome actualizado.</div>';
}
})();
